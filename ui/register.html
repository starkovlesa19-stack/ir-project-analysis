<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — HR Pro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-screen">
  <div class="auth-bg-glow auth-glow1"></div>
  <div class="auth-bg-glow auth-glow2"></div>
  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-mark">HR</div>
      <div class="brand-name">HR Pro</div>
      <div class="brand-sub">Создание аккаунта предприятия</div>
    </div>
    <form id="registerForm" class="auth-form active">
      <div class="field">
        <label>Имя и фамилия</label>
        <input type="text" id="regName" placeholder="Иван Иванов" required>
      </div>
      <div class="field">
        <label>Название предприятия</label>
        <input type="text" id="regCompany" placeholder="ООО «Ромашка»" required>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@company.ru" required>
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="regPassword" placeholder="Минимум 6 символов" required minlength="6">
      </div>
      <div class="field">
        <label>Повторите пароль</label>
        <input type="password" id="regPassword2" placeholder="••••••••" required minlength="6">
      </div>
      <div class="auth-error" id="regError"></div>
      <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
      <p class="auth-hint">Уже есть аккаунт? <a href="index.html" style="color:var(--champagne)">Войти</a></p>
    </form>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
